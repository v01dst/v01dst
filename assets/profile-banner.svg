<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Mahmoud Ahmed — software for builders</title>
  <desc id="desc">Dark banner with orange headline and node-graph motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1F2937" stroke-width="0.5"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#30363D"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)" opacity="0.5"/>
  <rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="#30363D" stroke-width="1.5"/>
  <!-- left accent bar -->
  <rect x="48" y="48" width="5" height="224" rx="2.5" fill="url(#accent)"/>
  <!-- label -->
  <text x="74" y="88" fill="#8B949E" font-family="monospace" font-size="12" letter-spacing="3">INDEPENDENT SOFTWARE BUILDER</text>
  <!-- headline -->
  <text x="72" y="152" fill="#F0F6FC" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5">Useful software for</text>
  <text x="72" y="206" fill="#F0F6FC" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5">people who build.</text>
  <!-- subtitle -->
  <text x="75" y="244" fill="#8B949E" font-family="Arial, Helvetica, sans-serif" font-size="15">Developer tools  ·  AI agents  ·  MCP  ·  systems</text>
  <!-- bottom accent -->
  <path d="M74 264H220" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M220 264H300" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>
  <!-- right node graph -->
  <g transform="translate(920,160)" opacity="0.9">
    <!-- connections -->
    <line x1="-60" y1="-70" x2="0" y2="0" stroke="#30363D" stroke-width="1"/>
    <line x1="60" y1="-70" x2="0" y2="0" stroke="#30363D" stroke-width="1"/>
    <line x1="-60" y1="70" x2="0" y2="0" stroke="#30363D" stroke-width="1"/>
    <line x1="60" y1="70" x2="0" y2="0" stroke="#30363D" stroke-width="1"/>
    <line x1="-60" y1="-70" x2="60" y2="-70" stroke="#30363D" stroke-width="1"/>
    <line x1="-60" y1="70" x2="60" y2="70" stroke="#30363D" stroke-width="1"/>
    <line x1="-60" y1="-70" x2="-60" y2="70" stroke="#30363D" stroke-width="1"/>
    <line x1="60" y1="-70" x2="60" y2="70" stroke="#30363D" stroke-width="1"/>
    <!-- outer nodes -->
    <circle cx="-60" cy="-70" r="8" fill="#161B22" stroke="#F97316" stroke-width="2"/>
    <circle cx="60" cy="-70" r="8" fill="#161B22" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="-60" cy="70" r="8" fill="#161B22" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="60" cy="70" r="8" fill="#161B22" stroke="#F97316" stroke-width="2"/>
    <!-- center node -->
    <circle cx="0" cy="0" r="16" fill="#F97316"/>
    <circle cx="0" cy="0" r="8" fill="#0D1117"/>
    <circle cx="0" cy="0" r="3" fill="#22D3EE"/>
    <!-- inner connections highlight -->
    <line x1="-60" y1="-70" x2="0" y2="0" stroke="#F97316" stroke-width="1" opacity="0.4"/>
    <line x1="60" y1="70" x2="0" y2="0" stroke="#22D3EE" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- corner accents -->
  <circle cx="1130" cy="50" r="5" fill="#F97316"/>
  <circle cx="1150" cy="50" r="3" fill="#22D3EE"/>
  <circle cx="860" cy="270" r="4" fill="#30363D"/>
  <circle cx="1140" cy="280" r="3" fill="#30363D"/>
</svg>