<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Mahmoud Ahmed GitHub profile banner</title>
<desc id="desc">Dark minimal developer banner with orange geometric signal lines and Mahmoud Ahmed name.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070304"/>
    <stop offset="0.55" stop-color="#0d0607"/>
    <stop offset="1" stop-color="#160807"/>
  </linearGradient>
  <radialGradient id="glow" cx="78%" cy="42%" r="55%">
    <stop offset="0" stop-color="#ff4401" stop-opacity=".30"/>
    <stop offset=".45" stop-color="#d94a2d" stop-opacity=".09"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
  </pattern>
</defs>
<rect width="1200" height="360" fill="url(#bg)"/>
<rect width="1200" height="360" fill="url(#grid)"/>
<rect width="1200" height="360" fill="url(#glow)"/>
<circle cx="970" cy="115" r="110" fill="#ff4401" opacity=".13" filter="url(#blur)"/>
<path d="M720 0L1035 315" stroke="#ff4401" stroke-width="2" opacity=".22"/>
<path d="M810 0L1170 360" stroke="#ff4401" stroke-width="1" opacity=".13"/>
<path d="M1200 72L912 360" stroke="#ffffff" stroke-width="1" opacity=".10"/>
<path d="M1035 0L675 360" stroke="#ffffff" stroke-width="1" opacity=".07"/>
<g fill="none" stroke="#ff4401" stroke-width="2">
  <path d="M780 255h110l38-38h92"/>
  <path d="M850 285h78l22-22h145"/>
  <path d="M1015 160h72l28-28h55"/>
</g>
<g fill="#ff4401">
  <circle cx="890" cy="255" r="4"/><circle cx="1075" cy="217" r="4"/><circle cx="928" cy="285" r="4"/><circle cx="1100" cy="132" r="4"/>
</g>
<g fill="#ffffff" font-family="Arial, Helvetica, sans-serif">
  <text x="72" y="118" font-size="18" letter-spacing="5" fill="#ff6a35">V01DST / ENGINEERING</text>
  <text x="72" y="178" font-size="56" font-weight="700" letter-spacing="1">MAHMOUD AHMED</text>
