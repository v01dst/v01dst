<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-labelledby="title desc">
  <title id="title">Mahmoud Ahmed — header</title>
  <desc id="desc">Dark header with orange monogram and cyan accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#30363D"/>
    </pattern>
  </defs>
  <rect width="1200" height="100" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="100" rx="16" fill="url(#dots)" opacity="0.6"/>
  <rect x="1" y="1" width="1198" height="98" rx="15" fill="none" stroke="#30363D" stroke-width="1"/>
  <!-- monogram -->
  <rect x="28" y="23" width="54" height="54" rx="14" fill="url(#mono)"/>
  <rect x="28" y="23" width="54" height="54" rx="14" fill="none" stroke="#EA580C" stroke-width="1"/>
  <text x="55" y="59" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="1">MA</text>
  <!-- name -->
  <text x="100" y="46" fill="#F0F6FC" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="2">MAHMOUD AHMED</text>
  <text x="101" y="68" fill="#8B949E" font-family="monospace" font-size="11" letter-spacing="2">SOFTWARE  ·  AI  ·  OPEN SOURCE</text>
  <!-- accent line -->
  <path d="M100 78H300" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>
  <path d="M300 78H380" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
  <!-- right accent -->
  <circle cx="1160" cy="50" r="8" fill="#F97316"/>
  <circle cx="1160" cy="50" r="4" fill="#22D3EE"/>
  <circle cx="1136" cy="50" r="3" fill="#30363D"/>
  <circle cx="1112" cy="50" r="3" fill="#30363D"/>
</svg>