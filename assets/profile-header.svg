<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-labelledby="title desc">
  <title id="title">Mahmoud Ahmed — header</title>
  <desc id="desc">Ivory header with blue monogram, name, and coral accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7F5EF"/>
      <stop offset="1" stop-color="#F1EEE5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="100" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="98" rx="15" fill="none" stroke="#D9DDE5" stroke-width="1.5"/>
  <!-- monogram -->
  <rect x="28" y="23" width="54" height="54" rx="14" fill="#3D58C8"/>
  <rect x="28" y="23" width="54" height="54" rx="14" fill="none" stroke="#2A42A8" stroke-width="1"/>
  <text x="55" y="59" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="1">MA</text>
  <!-- name -->
  <text x="100" y="46" fill="#1B2430" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="2">MAHMOUD AHMED</text>
  <text x="101" y="68" fill="#647084" font-family="monospace" font-size="11" letter-spacing="2">SOFTWARE  ·  AI  ·  OPEN SOURCE</text>
  <!-- accent line -->
  <path d="M100 78H340" stroke="#3D58C8" stroke-width="2" stroke-linecap="round"/>
  <path d="M340 78H420" stroke="#EE765B" stroke-width="2" stroke-linecap="round"/>
  <!-- right accent -->
  <circle cx="1160" cy="50" r="8" fill="#3D58C8"/>
  <circle cx="1160" cy="50" r="4" fill="#EE765B"/>
  <circle cx="1136" cy="50" r="3" fill="#D9DDE5"/>
  <circle cx="1112" cy="50" r="3" fill="#D9DDE5"/>
</svg>